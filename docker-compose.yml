# Usage:  docker compose --env-file .env.example up -d
services:
  traderengine.postgres:
    container_name: traderengine.postgres
    image: timescale/timescaledb:latest-pg18
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      # :Z relabels the host directory for exclusive SELinux access by this container — a plain
      # bind mount (unlike a Docker-managed named volume, which the container runtime pre-labels
      # for container access automatically) is otherwise denied by policy on an SELinux-enforcing
      # host, regardless of Unix ownership/mode or which filesystem backs the path. Uppercase,
      # not :z, because only this one container mounts this path. No-op on non-SELinux hosts.
      - ./.volumes/postgres-data:/var/lib/postgresql:Z
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
  traderengine.api:
    container_name: traderengine.api
    image: ${DOCKER_REGISTRY-}traderengine.api:${TAG:-latest}
    build:
      context: ./TraderEngine.API
      dockerfile: Dockerfile
    depends_on:
      traderengine.postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 5s
    volumes:
      # :z relabels the host directory for shared SELinux access — on an SELinux-enforcing host,
      # a bind mount is otherwise denied by policy regardless of Unix ownership/mode (confirmed
      # via a DataProtection KeyRingProvider UnauthorizedAccessException reading /app/secrets).
      # Lowercase, not :Z, because this same directory is mounted into both this container and
      # its sibling (they share one Data Protection key ring) — :Z's exclusive/private label
      # would let one relabel evict the other's access. No-op on non-SELinux hosts.
      - ./.volumes/secrets:/app/secrets:z
    environment:
      - TZ=Europe/Amsterdam
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Kestrel__Endpoints__Http__Url=http://*:80
      - ConnectionStrings__Postgres=Host=traderengine.postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD:?}
      - DataProtection__KeyRingPath=/app/secrets
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?}
      - AdminSeed__UserName=${ADMIN_USERNAME}
      - AdminSeed__Email=${ADMIN_EMAIL}
      - AdminSeed__Password=${ADMIN_PASSWORD}
      - CoinMarketCap__API_KEY=${CMC_API_KEY}
      - EmailSettings__SmtpServer=${SMTP_SERVER}
      - EmailSettings__SmtpPort=${SMTP_PORT}
      - EmailSettings__SmtpUsername=${SMTP_USERNAME}
      - EmailSettings__SmtpPassword=${SMTP_PASSWORD}
      - EmailSettings__FromAddress=${FROM_EMAIL_ADDRESS}
      - EmailSettings__WebsiteUrl=${WEBSITE_URL}
      - Rebalancing__FillWaitTimeoutSeconds=${REBALANCE_FILL_WAIT_TIMEOUT_SECONDS:-60}
  traderengine.web:
    container_name: traderengine.web
    image: ${DOCKER_REGISTRY-}traderengine.web:${TAG:-latest}
    build:
      context: ./TraderEngine.Web
      dockerfile: Dockerfile
    depends_on:
      traderengine.postgres:
        condition: service_healthy
      traderengine.api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 5s
    volumes:
      # :z relabels the host directory for shared SELinux access — on an SELinux-enforcing host,
      # a bind mount is otherwise denied by policy regardless of Unix ownership/mode (confirmed
      # via a DataProtection KeyRingProvider UnauthorizedAccessException reading /app/secrets).
      # Lowercase, not :Z, because this same directory is mounted into both this container and
      # its sibling (they share one Data Protection key ring) — :Z's exclusive/private label
      # would let one relabel evict the other's access. No-op on non-SELinux hosts.
      - ./.volumes/secrets:/app/secrets:z
    environment:
      - TZ=Europe/Amsterdam
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Kestrel__Endpoints__Http__Url=http://*:80
      - ConnectionStrings__Postgres=Host=traderengine.postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD:?}
      - DataProtection__KeyRingPath=/app/secrets
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?}
      - TraderEngineApi__BaseUrl=http://traderengine.api/
      - EmailSettings__SmtpServer=${SMTP_SERVER}
      - EmailSettings__SmtpPort=${SMTP_PORT}
      - EmailSettings__SmtpUsername=${SMTP_USERNAME}
      - EmailSettings__SmtpPassword=${SMTP_PASSWORD}
      - EmailSettings__FromAddress=${FROM_EMAIL_ADDRESS}
    ports:
      - "8081:80"
