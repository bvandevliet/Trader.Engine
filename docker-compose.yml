# Usage:  docker compose --env-file .env.example up -d
services:
  traderengine.postgres:
    container_name: traderengine.postgres
    image: timescale/timescaledb:latest-pg18
    volumes:
      - ./.volumes/postgres-data:/var/lib/postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  traderengine.api:
    container_name: traderengine.api
    image: ${DOCKER_REGISTRY-}traderengine.api:${TAG:-latest}
    restart: unless-stopped
    build:
      context: ./TraderEngine.API
      dockerfile: Dockerfile
    depends_on:
      - traderengine.postgres
    tty: true
    volumes:
      - ./.volumes/secrets:/app/secrets
    environment:
      - TZ=Europe/Amsterdam
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Kestrel__Endpoints__Http__Url=http://*:80
      - ConnectionStrings__Postgres=Host=traderengine.postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}
      - DataProtection__KeyRingPath=/app/secrets
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - AdminSeed__UserName=${ADMIN_USERNAME}
      - AdminSeed__Email=${ADMIN_EMAIL}
      - AdminSeed__Password=${ADMIN_PASSWORD}
      - CoinMarketCap__API_KEY=${CMC_API_KEY}
      - EmailSettings__SmtpServer=${SMTP_SERVER}
      - EmailSettings__SmtpPort=${SMTP_PORT}
      - EmailSettings__SmtpUsername=${SMTP_USERNAME}
      - EmailSettings__SmtpPassword=${SMTP_PASSWORD}
      - EmailSettings__FromAddress=${FROM_EMAIL_ADDRESS}
  traderengine.web:
    container_name: traderengine.web
    image: ${DOCKER_REGISTRY-}traderengine.web:${TAG:-latest}
    restart: unless-stopped
    build:
      context: ./TraderEngine.Web
      dockerfile: Dockerfile
    depends_on:
      - traderengine.postgres
      - traderengine.api
    ports:
      - "8081:80"
    volumes:
      # Shares the API's key ring: this host decrypts exchange credentials the API encrypted
      # (and vice versa), so both must read/write the same Data Protection key files.
      - ./.volumes/secrets:/app/secrets
    environment:
      - TZ=Europe/Amsterdam
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Kestrel__Endpoints__Http__Url=http://*:80
      - ConnectionStrings__Postgres=Host=traderengine.postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}
      - DataProtection__KeyRingPath=/app/secrets
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - TraderEngineApi__BaseUrl=http://traderengine.api/
      - EmailSettings__SmtpServer=${SMTP_SERVER}
      - EmailSettings__SmtpPort=${SMTP_PORT}
      - EmailSettings__SmtpUsername=${SMTP_USERNAME}
      - EmailSettings__SmtpPassword=${SMTP_PASSWORD}
      - EmailSettings__FromAddress=${FROM_EMAIL_ADDRESS}
